name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        run: brew install pre-commit shellcheck gitleaks
      # The same checks contributors run locally (see CONTRIBUTING.md).
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      # The pre-commit hook only scans staged changes; this scans every commit.
      - name: gitleaks (full history)
        run: gitleaks git --no-banner --redact .

  bootstrap:
    # Runs the real script on a clean macOS runner, so install and re-run
    # bugs show up here instead of on a new FDE's laptop.
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # Runners have FileVault off and can't turn it on. The script still
      # reports it, but doesn't fail the run for it.
      SKIP_FILEVAULT_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PR checkouts are a detached merge commit, so the clean-clone guard
      # would refuse. --force is fine here: CI is testing the change.
      - name: First run
        run: ./bootstrap.sh --force
      # Exit code 0 isn't enough: a re-run must also leave shell and git
      # config exactly as the first run did (no duplicated lines).
      - name: Snapshot config after first run
        run: |
          cat > "$RUNNER_TEMP/snapshot.sh" <<'EOF'
          for f in .zshrc .zshenv .zprofile .bashrc .bash_profile .profile; do
            echo "## ~/$f"
            cat "$HOME/$f" 2>/dev/null || echo "(none)"
          done
          echo "## git config --global"
          git config --global --list || true
          echo "## ~/.git-template"
          # Contents too, so a rewritten hook script shows up, not just a
          # new or missing file.
          find "$HOME/.git-template" -type f 2>/dev/null | sort | while IFS= read -r f; do
            echo "### $f"
            cat "$f"
          done
          EOF
          bash "$RUNNER_TEMP/snapshot.sh" > "$RUNNER_TEMP/before.txt"
      - name: Re-run (must be idempotent)
        run: ./bootstrap.sh --force
      - name: Check the re-run changed nothing
        run: |
          bash "$RUNNER_TEMP/snapshot.sh" > "$RUNNER_TEMP/after.txt"
          diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
